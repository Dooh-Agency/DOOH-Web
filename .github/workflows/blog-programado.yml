# Publica las notas del blog programadas para hoy.
#
# Las notas con `publishedAt` futuro quedan ocultas hasta ese día (lib/blog-posts.ts),
# pero el sitio es estático: hay que volver a armarlo para que aparezcan. Esta tarea
# corre todos los días a las 06:05 (hora de Argentina) y, solo si hay una nota con la
# fecha de hoy, pide un deploy nuevo a Cloudflare Pages con su deploy hook.
# Configuración: docs/deploy/CLOUDFLARE.md, sección “Notas programadas del blog”.

name: Blog programado

on:
  schedule:
    - cron: "5 9 * * *" # 09:05 UTC = 06:05 en Argentina
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar aunque hoy no haya notas programadas"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar notas con fecha de hoy
        id: check
        run: |
          today=$(TZ=America/Argentina/Buenos_Aires date +%F)
          count=$(grep -c "\"publishedAt\": \"$today\"" lib/blog-posts.ts || true)
          echo "Hoy es $today en Argentina. Notas con esa fecha: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Pedir deploy a Cloudflare Pages
        if: steps.check.outputs.count != '0' || inputs.force
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          # Al pegar la URL en GitHub pueden quedar espacios o saltos de línea.
          hook=$(printf '%s' "$DEPLOY_HOOK" | tr -d '[:space:]')
          if [ -z "$hook" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_DEPLOY_HOOK en GitHub (ver docs/deploy/CLOUDFLARE.md)."
            exit 1
          fi
          case "$hook" in
            https://api.cloudflare.com/*) ;;
            *)
              echo "::error::CLOUDFLARE_DEPLOY_HOOK no es la URL del deploy hook (debe empezar con https://api.cloudflare.com/). Volvé a copiarla desde Cloudflare."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error -X POST "$hook" > /dev/null
          echo "Deploy pedido a Cloudflare Pages."
